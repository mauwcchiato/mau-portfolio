<script>
  /* Apply the saved theme before first paint, so light mode never flashes dark. */
  (function () {
    try { if (localStorage.getItem("jm-theme") === "light") document.documentElement.setAttribute("data-theme", "light"); } catch (e) {}
  })();
  /* Play the brand intro once per visit, and never when motion is reduced. */
  (function () {
    var seen = false;
    try { seen = sessionStorage.getItem("jm-intro") === "1"; } catch (e) {}
    var calm = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (!seen && !calm) document.documentElement.classList.add("is-intro");
  })();
</script>
